<!doctype html>
<!-- SPDX-License-Identifier: 0BSD -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Monolith</title>
    <meta
      name="description"
      content="Projects, documents, calendars and knowledge in your Monolith workspace."
    />
    <meta name="theme-color" content="#191919" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="/brand/monolith-180.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      try {
        const choice = localStorage.getItem('monolith.theme')
        const dark =
          choice === 'dark' ||
          (choice === 'system' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
      } catch {
        /* Storage can be disabled in private browsing. */
      }
    </script>
    <style>
      :root {
        --boot-bg: #fff;
        --boot-fg: #252525;
      }
      :root.dark {
        --boot-bg: #191919;
        --boot-fg: #eeeeec;
        color-scheme: dark;
      }
      body {
        margin: 0;
        background: var(--boot-bg);
        color: var(--boot-fg);
      }
      .preloader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 20px;
        background: var(--boot-bg);
        font:
          14px/1.5 system-ui,
          sans-serif;
      }
      .boot-status {
        margin: 0;
        opacity: 0.65;
      }
      .boot-track {
        width: 100px;
        height: 2px;
        overflow: hidden;
        background: color-mix(in srgb, currentColor 12%, transparent);
      }
      .boot-track::after {
        content: '';
        display: block;
        width: 40%;
        height: 100%;
        background: currentColor;
        animation: boot-travel 1.4s ease-in-out infinite alternate;
      }
      @keyframes boot-travel {
        from {
          transform: translateX(0);
        }
        to {
          transform: translateX(150%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-track::after {
          animation: none;
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="preloader" role="status" aria-live="polite">
      <img src="/icon.svg" width="48" height="48" alt="Monolith" />
      <p class="boot-status">Opening your workspace</p>
      <div class="boot-track" aria-hidden="true"></div>
      <noscript>Enable JavaScript to open Monolith.</noscript>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>

name: Propose a Monolith improvement
description: Explain a workflow the product could support better.
title: "[Idea] "
labels: [enhancement]
body:
  - type: textarea
    id: workflow
    attributes:
      label: Your workflow
      description: What are you trying to accomplish, and where do you get stuck?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired behavior
      description: Describe a concrete example of the experience you want.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Related features or constraints
      description: Mention affected clients, addon interactions, or other details that would help evaluate the proposal.

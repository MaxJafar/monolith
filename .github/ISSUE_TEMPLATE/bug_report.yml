name: Report a Monolith problem
description: Share a reproducible problem with the application.
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: reproduce
    attributes:
      label: Steps and expected result
      description: Explain what you did, what happened, and what you expected.
    validations:
      required: true
  - type: input
    id: release
    attributes:
      label: Monolith version
      placeholder: Version shown in Settings → Updates
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: Where did this happen?
      options:
        - Web
        - Windows
        - macOS
        - Hosted server
        - Addon
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and environment
      description: Include operating system, browser, screenshots, or relevant logs. Remove credentials and private workspace content.

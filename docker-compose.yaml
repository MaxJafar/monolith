name: zillionos

services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: zillionos
      POSTGRES_USER: zillion_admin
      POSTGRES_PASSWORD: ${ZILLION_DB_ADMIN_PASSWORD:?Set ZILLION_DB_ADMIN_PASSWORD in env/.env.docker}
      ZILLION_DB_APP_PASSWORD: ${ZILLION_DB_APP_PASSWORD:?Set ZILLION_DB_APP_PASSWORD in env/.env.docker}
    volumes:
      - zillion_database:/var/lib/postgresql/data
      - ./docker/server/init-db.sh:/docker-entrypoint-initdb.d/01-zillion-app.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U zillion_admin -d zillionos']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    image: zillionos-server:local
    build:
      context: .
      dockerfile: docker/server/Dockerfile
      args:
        VITE_API_HOST: /api
    restart: 'no'
    entrypoint: ['/zillion/docker/server/migrate.sh']
    environment:
      NODE_ENV: development
      DOCKER_MODE: 'true'
      DATABASE_ADMIN_URL: postgres://zillion_admin:${ZILLION_DB_ADMIN_PASSWORD:?Set ZILLION_DB_ADMIN_PASSWORD}@db:5432/zillionos
    depends_on:
      db:
        condition: service_healthy

  server:
    image: zillionos-server:local
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://zillion_app:${ZILLION_DB_APP_PASSWORD:?Set ZILLION_DB_APP_PASSWORD}@db:5432/zillionos
      MASTER_KEY: ${MASTER_KEY:?Set MASTER_KEY in env/.env.docker}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in env/.env.docker}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
      FILE_STORAGE_LOCAL_PATH: /zillion/storage
    expose:
      - '3636'
    volumes:
      - zillion_files:/zillion/storage
    depends_on:
      migrate:
        condition: service_completed_successfully

  client:
    image: zillionos-client:local
    build:
      context: .
      dockerfile: docker/client/Dockerfile
      args:
        VITE_API_HOST: /api
    restart: unless-stopped
    ports:
      - '${ZILLION_HTTP_PORT:-8080}:80'
    depends_on:
      server:
        condition: service_healthy

volumes:
  zillion_database:
  zillion_files:
